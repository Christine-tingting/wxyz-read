<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>U7 听音配对 · 教材原声</title>
<style>
  :root{--orange:#FF7A45; --pink:#F94F8E; --teal:#2FA98C; --ink:#4A3B32;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:#FFF6EA; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink);}
  .wrap{max-width:560px; margin:0 auto; padding:14px 14px 80px;}
  h1{font-size:22px; margin:6px 0 4px; color:var(--pink);}
  .sub{font-size:13px; color:#8A796D; line-height:1.7;}
  .how{background:#fff; border-radius:16px; padding:13px 15px; margin:12px 0; font-size:13.5px;
       line-height:1.8; box-shadow:0 3px 12px rgba(74,59,50,.08); color:#7A6A5F;}
  .how b{color:var(--orange);}
  .bar{position:sticky; top:0; z-index:20; background:rgba(255,246,234,.95); backdrop-filter:blur(6px);
       padding:9px 0; margin-bottom:8px; border-radius:0 0 14px 14px;}
  .bar .stat{font-size:14px; font-weight:800; color:var(--teal);}
  .bar .miss{font-size:12px; color:#B45B2A; margin-top:4px; line-height:1.5;}
  .row{background:#fff; border-radius:14px; padding:11px 12px; margin-bottom:9px;
       box-shadow:0 2px 9px rgba(74,59,50,.07);}
  .row.picked{border:2px solid var(--teal);}
  .meta{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#A3938A; margin-bottom:8px;}
  .meta b{color:var(--orange); font-size:15px;}
  .ctrl{display:flex; gap:9px; align-items:center;}
  .play{flex:none; width:92px; border:none; border-radius:11px; padding:11px 0; font-size:14px; font-weight:800;
        color:#fff; background:linear-gradient(135deg,#FF9A62,var(--orange)); font-family:inherit;}
  .play.playing{background:linear-gradient(135deg,#5BC9AC,var(--teal));}
  select{flex:1; min-width:0; border:2px solid #FFE0CC; border-radius:11px; padding:10px 8px;
         font-size:14px; font-family:inherit; color:var(--ink); background:#fff;}
  .long{color:#E64545; font-weight:700;}
  .bottom{position:fixed; left:0; right:0; bottom:0; background:#fff; padding:10px 14px 14px;
          box-shadow:0 -4px 18px rgba(74,59,50,.14); z-index:30;}
  .bottom .inner{max-width:560px; margin:0 auto;}
  .btnrow{display:flex; gap:9px;}
  .gen{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:15px; font-weight:800;
       color:#fff; background:linear-gradient(135deg,#5BC9AC,var(--teal)); font-family:inherit;}
  .copy{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:15px; font-weight:800;
       color:#fff; background:linear-gradient(135deg,#F97FA8,var(--pink)); font-family:inherit;}
  .clear{flex:none; width:70px; border:2px solid #EEE0D5; border-radius:12px; background:#fff;
         font-size:13px; color:#A3938A; font-family:inherit;}
  textarea{width:100%; height:72px; margin-top:9px; border:2px solid #FFE0CC; border-radius:10px;
           padding:8px; font-size:12px; font-family:monospace; resize:none; color:#4A3B32;}
  .gallery{margin:10px 0;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 9px rgba(74,59,50,.07);}
  .gallery summary{cursor:pointer;font-size:14px;font-weight:800;color:var(--pink);}
  .gallery figure{margin:10px 0 0;}
  .gallery img{width:100%;border-radius:10px;border:1px solid #FFE0CC;}
  .gallery figcaption{font-size:12px;color:#8A796D;margin-top:4px;line-height:1.5;}
  .tip{font-size:11.5px; color:#B7A99F; margin-top:6px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 U7 听音配对</h1>
  <div class="sub">教材二维码里的官方原声，已切成 45 段。听一段、选一句，我就能把跟读页的发音换成原版。</div>

  <div class="how">
    👉 点 <b>▶ 听这段</b> 听发音，再从右边选出它是哪句话 / 哪个单词。<br>
    · 同一句只选一次（重复选会自动清掉前一个）<br>
    · 听不出、中文提示、歌曲或重复读的，选 <b>跳过 / 其他</b><br>
    · 第 <b>28 段</b> 是 14 秒连读（很可能是歌曲或整篇课文），一般跳过<br>
    · 选完点底部 <b>生成配对结果 → 复制</b>，把文本发给我就行
  </div>

  document.getElementById('miss').textContent = missing.length
      ? '还缺：' + missing.join('、')
      : '✅ 全部句子都找到了，可以生成结果了！';
  selects.forEach(function(s){
    var row = document.getElementById('row' + s.getAttribute('data-i'));
    if (s.value !== 'skip' && s.value !== 'other') row.classList.add('picked');
    else row.classList.remove('picked');
  });
}
function save(){
  var o = {};
  selects.forEach(function(s){ o[s.getAttribute('data-i')] = s.value; });
  try { localStorage.setItem('u7_match_v2', JSON.stringify(o)); } catch(e){}
  refresh();
}
selects.forEach(function(s){
  s.addEventListener('change', function(){
    var v = s.value;
    if (v !== 'skip' && v !== 'other'){
      selects.forEach(function(o){ if (o !== s && o.value === v) o.value = 'skip'; });
    }
    save();
  });
});
refresh();

var cur = null, curBtn = null;
document.addEventListener('click', function(e){
  var b = e.target.closest('.play');
  if (!b) return;
  var i = parseInt(b.getAttribute('data-i'), 10) - 1;
  if (cur) { try { cur.pause(); cur.currentTime = 0; } catch(err){} }
  if (curBtn) curBtn.classList.remove('playing');
  var a = new Audio(SEG[i]);
  cur = a; curBtn = b;
  b.classList.add('playing');
  a.onended = function(){ b.classList.remove('playing'); };
  a.play().catch(function(){ b.classList.remove('playing'); });
});

function buildText(){
  return selects.map(function(s){
    var i = s.getAttribute('data-i');
    return 'seg' + (i < 10 ? '0' + i : i) + '=' + s.value;
  }).join('\n');
}
document.getElementById('gen').onclick = function(){
  document.getElementById('out').value = buildText();
};
document.getElementById('copy').onclick = function(){
  var ta = document.getElementById('out');
  if (!ta.value) ta.value = buildText();
  var text = ta.value;
  function fallback(){
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e){}
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){}, fallback);
  } else { fallback(); }
  var b = document.getElementById('copy');
  b.textContent = '已复制 ✓';
  setTimeout(function(){ b.textContent = '复制结果'; }, 1600);
};
document.getElementById('clear').onclick = function(){
  selects.forEach(function(s){ s.value = 'skip'; });
  document.getElementById('out').value = '';
  save();
};
</script>
</body>
</html>
